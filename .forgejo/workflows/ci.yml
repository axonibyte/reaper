# CI for the Rust group -- bgone, ddwill, isolex, lychgate, reaper.
#
# Ported from rumor's .forgejo/workflows/ci.yml, and the discipline carries over
# whole: ONE FreeBSD job; no actions/checkout (a pull request is fetched by its
# refs/pull/<n>/head from this repository, which is the only way a request from
# a fork can be fetched at all); a timeout(1) on every external
# call plus a timeout-minutes backstop; rc 124 reported separately from a
# failure; `set -o pipefail`; redirect-then-read-status rather than a pipe; a
# non-fatal probe first; and every step emitting a value only execution could
# have produced.
#
# THIS ONE RUNS ON THE HOST, and it is the exception among the Rust repos --
# bgone, ddwill, isolex and lychgate all run in the jail. reaper's end-to-end
# suite stands up a mock Proxmox API on localhost, and reaper itself refuses
# plain HTTP to anything that is not loopback:
#     [proxmox].api "http://192.168.69.2:55856" is plain HTTP to
#     "192.168.69.2"; the API token would travel in clear text. Use https, or
#     loopback for testing
# The ci jail is non-VNET with one address, so "localhost" binds 192.168.69.2 and
# 92 of the 107 end-to-end tests fail on that refusal. MEASURED BOTH WAYS on
# 2026-10-20: pristine main fails identically in the jail (15 passed, 92 failed,
# 91 of them that refusal), so it is the environment and not this branch; on the
# host, where 127.0.0.1 is real, all 107 pass. That refusal is reaper doing its
# job, so the runner moves rather than the check.
#
# THE SUITE ALSO REQUIRES rsync, by its own design -- core/src/tests.rs refuses
# to pass without it: "rsync is not installed, so the flags in sync.rs have
# never been run. Install it rather than letting this suite pass without
# checking them." It is installed on the host now. A green here therefore means
# the sync flags were actually exercised.
#
# THE CROSS-TARGETS ARE GONE, and that is a narrowing with a reason. The
# bitbucket pipeline built four: x86_64-unknown-linux-gnu,
# aarch64-unknown-linux-gnu, x86_64-unknown-freebsd and aarch64-unknown-freebsd,
# each through ci/build-target.sh in a rust:1.97 container. The jail's rust comes
# from pkg with NO rustup, and only two target stdlibs are installed --
# x86_64-unknown-freebsd and wasm32 -- so the other three cannot be built here at
# all, and a step that cannot run is worse than an absent one: it reads as a
# pass. cal parked the question 2026-10-20 ("if these are on public repos we
# might have github actions just build them there as well but I haven't decided
# yet"), so this file builds the ONE target this runner can, says so, and leaves
# ci/build-target.sh in the tree for whoever answers that question.
#
# THE PIN IS 1.97 AND THE JAIL HAS 1.98.1, which is why the probe step prints
# what it actually got: a toolchain drift shows up as a changed value rather
# than as a mysterious new clippy failure. `--locked` everywhere keeps
# Cargo.lock authoritative, exactly as the pipeline had it.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # NO `permissions:` BLOCK, DELIBERATELY. This forge IGNORES the key, so
    # declaring it states a contract nothing enforces. MEASURED on Forgejo
    # 15.0.9, 2026-10-27: a job declaring `permissions: contents: read` was
    # allowed to CREATE A RELEASE -- a contents write -- and the forge
    # answered 201. An earlier version of this file carried `contents: write`
    # with a comment calling it "a stated contract" so "a step that needs
    # more fails by name instead of succeeding on borrowed reach". That was
    # false in every clause, and a comment asserting a guarantee that does
    # not exist is worse than no comment: it tells the next reader the job is
    # bounded when it is not.
    #
    # Forgejo's position is that the automatic token carries repository
    # access and is not configurable per job (forgejo#6904, closed by
    # design). Authorized Integrations in 16.0 are the supported way to ask
    # for more; this forge runs 15.0.9 and does not have them.
    runs-on: freebsd-15-host
    timeout-minutes: 45
    steps:
      - name: probe the runner (non-fatal; names what is absent)
        run: |
          set -o pipefail
          echo "runner: $(uname -srm)"
          for t in git cargo rustc shellcheck shfmt jq; do
            p=$(command -v "$t" 2>/dev/null) || p=""
            if [ -n "$p" ]; then echo "$t: $p"; else echo "$t: ABSENT"; fi
          done
          timeout 30 rustc -V || echo "rustc: did not answer in 30s"
          timeout 30 cargo -V || echo "cargo: did not answer in 30s"
          echo "installed target stdlibs: $(ls /usr/local/lib/rustlib 2>/dev/null | tr '\n' ' ')"

      - name: fetch the tree with git, not a JS action
        run: |
          set -o pipefail
          rc=0
          repo="${GITHUB_SERVER_URL:-https://forge.axonibyte.com}/${GITHUB_REPOSITORY}.git"
          # A pull request's ref is refs/pull/<n>/head: not a branch, so
          # `--branch` cannot name it, and for a request from a fork it names
          # a commit that lives in the fork and not here. The base repository
          # serves that ref itself, fork or not, so a pull request is fetched
          # by it -- the request's own head, which is what the HEAD line
          # below then names. A push or a tag is the branch or tag it says.
          case "${GITHUB_REF:-}" in
            refs/pull/*)
              pr=${GITHUB_REF#refs/pull/}; pr=${pr%%/*}
              what="pull request #${pr}"
              timeout 180 git clone --quiet --depth 1 --no-checkout "$repo" src > clone.log 2>&1 || rc=$?
              if [ "$rc" = 0 ]; then
                timeout 180 git -C src fetch --quiet --depth 1 origin "refs/pull/${pr}/head" >> clone.log 2>&1 || rc=$?
              fi
              if [ "$rc" = 0 ]; then
                git -C src checkout --quiet --detach FETCH_HEAD >> clone.log 2>&1 || rc=$?
              fi ;;
            *)
              what="${GITHUB_REF_NAME:-main}"
              timeout 180 git clone --quiet --depth 1 --branch "$what" "$repo" src > clone.log 2>&1 || rc=$? ;;
          esac
          if [ "$rc" = 124 ]; then echo "fetching $what did not answer in 180s"; exit 1; fi
          if [ "$rc" != 0 ]; then echo "fetching $what failed rc=$rc"; tail -5 clone.log; exit 1; fi
          echo "fetched: $what"
          echo "HEAD: $(git -C src rev-parse --short HEAD)"
          # The CLI crate's manifest, not the root: the root is a workspace
          # manifest with no name or version of its own, and a tag check that
          # read it refused every tag with "declares no version".
          crate=$(sed -n 's/^name *= *"\(.*\)"/\1/p' src/cli/Cargo.toml | head -1)
          ver=$(sed -n 's/^version *= *"\(.*\)"/\1/p' src/cli/Cargo.toml | head -1)
          echo "crate: $crate version: $ver"

      - name: dependencies, from the lockfile and nowhere else
        run: |
          set -o pipefail
          cd src
          rc=0
          timeout 600 cargo fetch --locked > ../fetch.log 2>&1 || rc=$?
          if [ "$rc" = 124 ]; then echo "cargo fetch did not answer in 600s"; exit 1; fi
          [ "$rc" = 0 ] || { echo "cargo fetch rc=$rc"; tail -10 ../fetch.log; exit 1; }
          echo "crates in the lockfile: $(grep -c '^\[\[package\]\]' Cargo.lock)"

      - name: formatting
        run: |
          set -o pipefail
          cd src
          rc=0
          timeout 120 cargo fmt --check > ../fmt.log 2>&1 || rc=$?
          if [ "$rc" = 124 ]; then echo "cargo fmt did not answer in 120s"; exit 1; fi
          [ "$rc" = 0 ] || { echo "cargo fmt --check rc=$rc"; head -40 ../fmt.log; exit 1; }
          echo "rustfmt had nothing to say about $(find . -name '*.rs' -not -path './target/*' | wc -l | tr -d ' ') files"

      - name: clippy, warnings are errors
        run: |
          set -o pipefail
          cd src
          rc=0
          timeout 900 cargo clippy --all-targets --locked -- -D warnings > ../clippy.log 2>&1 || rc=$?
          if [ "$rc" = 124 ]; then echo "clippy did not answer in 900s"; exit 1; fi
          [ "$rc" = 0 ] || { echo "clippy rc=$rc"; grep -E '^(error|warning)' ../clippy.log | head -20; exit 1; }
          echo "clippy checked $(grep -c 'Checking\|Compiling' ../clippy.log) crate compilations with no warning left"

      - name: the tests
        run: |
          set -o pipefail
          cd src
          rc=0
          timeout 1800 cargo test --release --locked > ../test.log 2>&1 || rc=$?
          if [ "$rc" = 124 ]; then echo "cargo test did not answer in 1800s"; exit 1; fi
          [ "$rc" = 0 ] || { echo "cargo test rc=$rc"; grep -E '^(test result|failures:|error)' ../test.log | head -20; exit 1; }
          grep -E '^test result' ../test.log | head -10
          p=$(grep -E '^test result' ../test.log | sed -n 's/.*ok\. \([0-9]*\) passed.*/\1/p' | awk '{s+=$1} END {print s+0}')
          echo "tests passed: $p"
          [ "$p" -gt 0 ] || { echo "zero tests ran, which is not a pass"; exit 1; }

      - name: the local gate, so the forge cannot pass a tree tools/check.sh refuses
        run: |
          set -o pipefail
          cd src
          rc=0
          # Everything the README names as the gate before a commit: the
          # warnings build, the shell lint, the seam guards, the invariants,
          # the manifest and runner suites, the sweepers. Until this step
          # existed the forge was green on a tree the gate refused (#5), which
          # is the one shape a gate must not have. The shell lint wants
          # shellcheck and shfmt on this runner and refuses to pass without
          # them, by its own design, and the sweeper suite wants jq; the
          # probe above says whether they are.
          timeout 1500 ./tools/check.sh > ../check.log 2>&1 || rc=$?
          if [ "$rc" = 124 ]; then echo "tools/check.sh did not answer in 1500s"; exit 1; fi
          if [ "$rc" = 0 ]; then
            grep -E '^=== |passed, |all checks passed' ../check.log | tail -20
            echo "the local gate agrees with the forge"
          else
            # The whole log, not a summary: the first run of this step was red
            # on a one-line "these tests need jq" that a summary filter hid.
            cat ../check.log
            echo "tools/check.sh rc=$rc"
            exit 1
          fi

      - name: the release build, for the one target this runner has
        run: |
          set -o pipefail
          cd src
          rc=0
          timeout 1800 cargo build --release --locked > ../build.log 2>&1 || rc=$?
          if [ "$rc" = 124 ]; then echo "cargo build did not answer in 1800s"; exit 1; fi
          [ "$rc" = 0 ] || { echo "cargo build rc=$rc"; grep -E '^error' ../build.log | head -20; exit 1; }
          n=0
          for f in target/release/*; do
            [ -f "$f" ] && [ -x "$f" ] || continue
            case "$f" in *.d|*.rlib|*.rmeta) continue ;; esac
            echo "$(basename "$f") $(wc -c < "$f" | tr -d ' ') bytes sha256=$(sha256 -q "$f")"
            n=$((n + 1))
          done
          echo "executables built: $n (target x86_64-unknown-freebsd, the only stdlib on this runner)"
          [ "$n" -ge 1 ] || { echo "the release build produced no executable"; exit 1; }

      - name: on a tag, the tag and the CLI crate's version must agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -o pipefail
          cd src
          tag="${GITHUB_REF_NAME}"
          # cli/Cargo.toml: the root is a workspace manifest with no version.
          ver=$(sed -n 's/^version *= *"\(.*\)"/\1/p' cli/Cargo.toml | head -1)
          [ -n "$ver" ] || { echo "cli/Cargo.toml declares no version"; exit 1; }
          echo "tag=$tag cli/Cargo.toml version=$ver"
          case "$tag" in
            "v$ver"|"$ver") echo "they agree" ;;
            *) echo "REFUSED: tag $tag does not name version $ver"; exit 1 ;;
          esac

      # THE RELEASE PATH, DRIVEN WITHOUT A TAG. Everything in the step below
      # runs only on refs/tags, so nothing exercises the token's reach or the
      # attach until a release is already under way -- which is exactly how
      # six binaries reached the package registry unlinked and nobody saw it,
      # and how the old publish step survived to 2026-10-27 holding a
      # credential that could not have worked. The same three calls here run
      # against a DRAFT release on a throwaway tag and delete it afterwards,
      # so the mechanism is provable on any manual run.
      #
      # A DRAFT ON A TAG THAT DOES NOT EXIST publishes nothing: Forgejo
      # creates the tag only when the release leaves draft, so this cannot
      # leave a tag or a visible release behind even if the delete fails.
      - name: prove the release path (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          [ -n "$RELEASE_TOKEN" ] || { echo "the job was minted no token"; exit 1; }
          command -v jq > /dev/null 2>&1 || { echo "jq is ABSENT and this step reads the forge's JSON with it. PROVISIONING finding."; exit 1; }
          api="${GITHUB_SERVER_URL:-https://forge.axonibyte.com}/api/v1/repos/${GITHUB_REPOSITORY}"
          tag="ci-selftest-${GITHUB_RUN_ID:-manual}"
          cfg=$(mktemp); chmod 600 "$cfg"
          printf 'header = "Authorization: token %s"\n' "$RELEASE_TOKEN" > "$cfg"
          trap 'rm -f "$cfg"' EXIT
          printf 'selftest\n' > selftest.txt

          payload=$(jq -nc --arg t "$tag" '{tag_name: $t, name: $t, draft: true, prerelease: true}')
          code=$(printf '%s' "$payload" | timeout 60 curl --config "$cfg" -s -o rel.json -w '%{http_code}' \
                 -X POST -H 'Content-Type: application/json' --data-binary @- "$api/releases")
          echo "CREATE -> $code"
          case "$code" in
            200 | 201) : ;;
            *) echo "the minted token CANNOT create a release"; head -c 400 rel.json; exit 1 ;;
          esac
          id=$(jq -r '.id' < rel.json)
          if [ -z "$id" ] || [ "$id" = null ]; then echo "no release id"; head -c 400 rel.json; exit 1; fi

          code=$(timeout 60 curl --config "$cfg" -s -o asset.json -w '%{http_code}' \
                 -X POST -F "attachment=@selftest.txt" "$api/releases/$id/assets?name=selftest.txt")
          echo "ATTACH -> $code"
          case "$code" in
            200 | 201) : ;;
            *) echo "the minted token CANNOT attach a release asset"; head -c 400 asset.json
               timeout 60 curl --config "$cfg" -s -o /dev/null -X DELETE "$api/releases/$id"; exit 1 ;;
          esac

          seen=$(timeout 60 curl --config "$cfg" -s "$api/releases/$id" | jq -r '[.assets[].name] | join(" ")')
          if [ "$seen" = "selftest.txt" ]; then
            echo "ASSERTED: release $tag reads back carrying exactly [$seen]"
          else
            echo "the attach reported success and the release carries [$seen]"
            timeout 60 curl --config "$cfg" -s -o /dev/null -X DELETE "$api/releases/$id"; exit 1
          fi

          # CLEANED UP, so a proof does not leave a release behind. The delete
          # is CHECKED: a self-test that quietly accumulates draft releases is
          # the kind of mess nobody notices until there are forty of them.
          gone=$(timeout 60 curl --config "$cfg" -s -o /dev/null -w '%{http_code}' -X DELETE "$api/releases/$id")
          echo "DELETE -> $gone"
          case "$gone" in
            204) : ;;
            *) echo "the draft release $tag (id $id) could NOT be deleted and is still there"; exit 1 ;;
          esac

      # THE BINARIES GO TO THE RELEASE, NOT TO THE PACKAGE REGISTRY. Until
      # 2026-10-27 a tag here PUT each executable into the org's GENERIC
      # package registry, which is why reaper has five tags and zero releases:
      # nothing a person could download from the tag they were pointed at.
      # cal's correction, 2026-10-27 -- "Packages are more for containers or
      # dependency stores. Releases are for human downloads." The maven
      # libraries keep publishing to the registry, because a gradle consumer
      # is a machine; a compiled executable handed to an operator is not.
      #
      # THE SAME CHANGE SETTLES THE CREDENTIAL. Task 681 drove the package
      # path with the job's own token and it answered `PUT -> 401`,
      # reqPackageAccess: the minted token is refused by the registry. rumor's
      # tag-pipeline has created every one of its releases with that same
      # minted token. So the destination that is correct is also the one that
      # works, and no personal credential appears on either side of it.
      - name: on a tag, create the release and attach the binaries
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # THE JOB'S OWN TOKEN, NOT A PERSON'S. This published as agent-ibis
          # through an ORG-level PACKAGE_TOKEN until 2026-10-27: a personal
          # credential every repo in the org could read, which breaks for all
          # of them the day that account rotates, and which stamps a human's
          # name on an automated upload (plumb, coop main/370). Forgejo mints
          # a token per run, scoped to this repository; no secret named
          # GITHUB_TOKEN exists on this forge, which is how we know this
          # spelling resolves to the minted one and not to somebody's.
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          cd src || exit 1
          [ -n "$RELEASE_TOKEN" ] || { echo "the job was minted no token: refusing to report a publish that cannot happen"; exit 1; }
          command -v jq > /dev/null 2>&1 || { echo "jq is ABSENT and this step reads the forge's JSON with it. PROVISIONING finding, publishing nothing."; exit 1; }
          tag="${GITHUB_REF_NAME}"
          ver=$(sed -n 's/^version *= *"\(.*\)"/\1/p' cli/Cargo.toml | head -1)
          [ -n "$ver" ] || { echo "cli/Cargo.toml declares no version"; exit 1; }
          api="${GITHUB_SERVER_URL:-https://forge.axonibyte.com}/api/v1/repos/${GITHUB_REPOSITORY}"
          # The credential reaches curl through a 0600 config file and never
          # through argv: `ps` is world readable on this runner.
          cfg=$(mktemp); chmod 600 "$cfg"
          printf 'header = "Authorization: token %s"\n' "$RELEASE_TOKEN" > "$cfg"
          trap 'rm -f "$cfg"' EXIT

          # STAGED UNDER NAMES THAT SAY WHAT THEY ARE. Two releases' worth of
          # a bare `reaper` are two different files with one name in the
          # reader's downloads folder, and nothing on the file says which tag
          # or which platform it came from.
          rm -rf ../dist && mkdir -p ../dist
          n=0
          for f in target/release/*; do
            [ -f "$f" ] && [ -x "$f" ] || continue
            case "$f" in *.d | *.rlib | *.rmeta) continue ;; esac
            cp "$f" "../dist/$(basename "$f")-$ver-x86_64-unknown-freebsd" || exit 1
            n=$((n + 1))
          done
          [ "$n" -ge 1 ] || { echo "the release build produced no executable to attach"; exit 1; }
          # SHA256SUMS IS WRITTEN OUTSIDE dist AND MOVED IN. The redirection
          # is opened before the subshell changes directory, so writing it
          # straight into dist/ would create the file first and the glob would
          # then checksum the checksum file.
          (cd ../dist && sha256 -r -- *) > ../SHA256SUMS || { echo "could not checksum the staged binaries"; exit 1; }
          mv ../SHA256SUMS ../dist/SHA256SUMS
          echo "staged $n binary file(s) and SHA256SUMS:"
          cat ../dist/SHA256SUMS

          # 0.x IS A PRERELEASE, the same rule rumor's tag pipeline applies, so
          # the forge's "latest" does not advertise a version the project has
          # not promised to keep stable.
          case "$ver" in 0.*) pre=true ;; *) pre=false ;; esac
          payload=$(jq -nc --arg t "$tag" --argjson p "$pre" \
                    '{tag_name: $t, name: $t, draft: false, prerelease: $p}')
          code=$(printf '%s' "$payload" | timeout 60 curl --config "$cfg" -s -o ../rel.json -w '%{http_code}' \
                 -X POST -H 'Content-Type: application/json' --data-binary @- "$api/releases")
          case "$code" in
            200 | 201)
              id=$(jq -r '.id' < ../rel.json)
              echo "created release $tag -> id $id" ;;
            # A RE-RUN OF THE SAME TAG REACHES 409 LEGITIMATELY -- a cancelled
            # run, a retried job -- so the existing release is read back and
            # attached to rather than called a failure. It is still not an
            # overwrite: an asset that is already there makes the attach below
            # refuse, so a published file cannot be quietly replaced.
            409)
              code=$(timeout 60 curl --config "$cfg" -s -o ../rel.json -w '%{http_code}' "$api/releases/tags/$tag")
              [ "$code" = 200 ] || { echo "release $tag exists and cannot be read back: $code"; head -c 300 ../rel.json; exit 1; }
              id=$(jq -r '.id' < ../rel.json)
              echo "release $tag already exists -> id $id; attaching to it" ;;
            *)
              echo "creating the release for $tag answered $code"; head -c 300 ../rel.json; exit 1 ;;
          esac
          if [ -z "$id" ] || [ "$id" = null ]; then
            echo "the forge answered without a release id"; head -c 300 ../rel.json; exit 1
          fi

          for f in ../dist/*; do
            b=$(basename "$f")
            code=$(timeout 300 curl --config "$cfg" -s -o ../asset.log -w '%{http_code}' \
                   -X POST -F "attachment=@$f" "$api/releases/$id/assets?name=$b")
            echo "attach $b -> $code"
            case "$code" in
              200 | 201) : ;;
              *) echo "attaching $b failed"; head -c 300 ../asset.log; exit 1 ;;
            esac
          done

          # READ THE RELEASE BACK AND COMPARE THE WHOLE SET. "the POST answered
          # 201" and "the release carries these files" are different claims,
          # and only the second is what a person clicking the tag receives.
          # Six packages reached the registry unlinked precisely because
          # nothing ever asserted the second one.
          code=$(timeout 60 curl --config "$cfg" -s -o ../rel2.json -w '%{http_code}' "$api/releases/$id")
          [ "$code" = 200 ] || { echo "reading release $id back answered $code"; exit 1; }
          got=$(jq -r '[.assets[].name] | sort | join(" ")' < ../rel2.json)
          want=$(cd ../dist && for g in *; do echo "$g"; done | sort | tr '\n' ' ' | sed 's/ $//')
          [ "$got" = "$want" ] || { echo "REFUSED: release $tag carries [$got] and this run attached [$want]"; exit 1; }
          echo "asserted: release $tag carries exactly $((n + 1)) asset(s): $got"

          # ANONYMOUS READ-BACK OF ONE BYTE STREAM, because the assert above is
          # the forge agreeing with itself about names. This is the download a
          # person actually performs, and it is checked against the file that
          # was built.
          first=$(jq -r '[.assets[] | select(.name != "SHA256SUMS")] | sort_by(.name) | .[0].browser_download_url' < ../rel2.json)
          fname=$(basename "$first")
          got=$(timeout 300 curl -sS -L -o "../fetched-$fname" -w '%{http_code}' "$first")
          [ "$got" = 200 ] || { echo "downloading $fname anonymously answered $got"; exit 1; }
          cmp -s "../dist/$fname" "../fetched-$fname" || { echo "the served asset is not the file this run built"; exit 1; }
          echo "read back anonymously -> $got, $fname byte-identical to the build"
